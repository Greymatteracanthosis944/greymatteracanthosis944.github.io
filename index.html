<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lunezo79 | Roblox Studio Portfolio</title>

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: radial-gradient(circle at center, #2a1a3d 0%, #150d1f 35%, #0a0508 70%, #000000 100%);
    background-attachment: fixed;
    color: #111;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;

  .profile-pic {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
    margin-bottom: 20px;
  }

  header {
    text-align: center;
    padding: 60px 20px 40px;
    color: #ffffff;
  }

  header h1 {
    font-size: 2.5rem;
    letter-spacing: 1px;
  }

  header h1 a {
    color: #ffffff;
    text-decoration: none;
  }

  header h1 a:hover {
    text-decoration: underline;
  }

  header p {
    color: #aaaaaa;
    margin-top: 10px;
    font-size: 1.1rem;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
  }

    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    margin-bottom: 50px;
  }

    color: inherit;
    display: block;
  }
